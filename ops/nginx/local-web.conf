# samplepcb-web-platform — 같은 도메인 통합 라우팅 (local-web.samplepcb.co.kr)
# nginx.conf 의 http{} 안에서 include 하거나 server 블록으로 사용.
# 구체적 location(/api, /app, /market)을 먼저, catch-all(/)을 마지막에 둔다.
#
# 이 파일은 repo 추적용 레퍼런스 스니펫. 실제 구동 config 는 D:\nginx\conf\nginx.conf (repo 밖)이며
# 아래 통합 호스트 블록이 그대로 반영돼 있다(라이브 /app 엔 X-Forwarded-Proto 한 줄 추가).
# 모노레포(/api·/app·/market) 가동 중 — 3경로 모두 동작(/market 은 2026-07-08 라이브 반영 완료).
# ⚠ /rnd(연구용 앱)는 2026-08-28 폐지 — 라이브 nginx 에도 남아 있으면 upstream·location 을 지울 것.
# ⚠ 라이브 nginx 는 Windows 서비스('nginx')라 `nginx -s reload` 신호가 Access denied —
#   변경 반영은 관리자 권한 `net stop nginx & net start nginx`.
# 라이브엔 개발용 부가 호스트도 있음: local·local-www→5173(Vue 단독), local2·local3→5174·5175(worktree).
#
# ⚠ upstream keepalive 는 **선택이 아니다**(2026-08-16 실측). Vite dev 는 모듈 하나가 요청
#   하나라, e2e 여정을 연속으로 돌리면 짧은 시간에 수만 건이 나간다. 연결을 재사용하지
#   않으면 소켓이 TIME_WAIT 으로 쌓여 **Windows 임시 포트(이 머신 13,977개)가 고갈**되고,
#   nginx error.log 에 `10048 Only one usage of each socket address` 가 쏟아지며 **502** 가
#   된다. 브라우저에는 SPA 모듈이 안 내려와 빈 화면(hidden body)으로 보이고 e2e 는
#   "버튼이 안 보인다"로 죽는다 — 원인이 화면처럼 보이지만 실체는 프록시다.
#   재사용을 막던 범인은 `Connection "upgrade"` 고정값이었다(HMR 용인데 일반 요청까지
#   업그레이드로 표시해 매번 새 연결). map 으로 갈라 준다 — nginx 공식 WebSocket 관례.

# http{} 컨텍스트에 한 번만 둔다(server 블록 밖).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';          # 일반 요청은 keep-alive 유지
}

upstream vite_app    { server 127.0.0.1:5173; keepalive 64; }
upstream vite_market { server 127.0.0.1:5176; keepalive 32; }
upstream node_api    { server 127.0.0.1:3333; keepalive 32; }

server {
    listen       443 ssl;
    server_name  local-web.samplepcb.co.kr;

    ssl_certificate     _wildcard.samplepcb.co.kr.pem;
    ssl_certificate_key _wildcard.samplepcb.co.kr-key.pem;

    client_max_body_size 100M;

    # 1) Node API (Fastify)
    location /api/ {
        proxy_pass http://node_api;
        proxy_http_version 1.1;            # keepalive 는 1.1 에서만 동작
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2) Vue 앱 — [개발] Vite dev + HMR
    location /app/ {
        proxy_pass http://vite_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;   # HMR 만 upgrade, 나머지는 재사용
        proxy_set_header Host       $host;
    }
    # 2') Vue 앱 — [운영] 빌드 static + SPA fallback  (위 /app 블록과 택1)
    # location /app/ {
    #     alias D:/work/workspace_other/samplepcb-web-platform/samplepcb-web-mono-app/apps/web/dist/;
    #     try_files $uri $uri/ /app/index.html;     # /app 내부로만 한정
    # }

    # 3) 재능마켓 앱 — [개발] Vite dev + HMR
    location /market/ {
        proxy_pass http://vite_market;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
    }
    # 3') 재능마켓 앱 — [운영] 빌드 static + SPA fallback  (위 /market 블록과 택1)
    # location /market/ {
    #     alias D:/work/workspace_other/samplepcb-web-platform/samplepcb-web-mono-app/apps/market/dist/;
    #     try_files $uri $uri/ /market/index.html;  # /market 내부로만 한정
    # }

    # 4) 나머지 전부 → PHP (그누보드/영카트)
    location / {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# http → https
server {
    listen 80;
    server_name local-web.samplepcb.co.kr;
    return 301 https://$host$request_uri;
}

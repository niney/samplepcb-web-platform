<html lang="ko">
<head>
<meta charset="utf-8">

<title>연호전자 커넥터 카탈로그 — DB/ES 인제스트 분석결과</title>
<style>
  :root{
    --bg:#f7f7f8; --panel:#fff; --line:#e3e3e6; --fg:#18181b; --muted:#6b7280;
    --accent:#1d4ed8; --ok:#15803d; --warn:#b45309; --err:#b91c1c; --chip:#f1f2f4;
  }
  @media (prefers-color-scheme: dark){
    :root{--bg:#111114;--panel:#18181c;--line:#2a2a31;--fg:#ececed;--muted:#9ca3af;
      --accent:#7aa2ff;--ok:#4ade80;--warn:#fbbf24;--err:#f87171;--chip:#22222a;}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 -apple-system,"Segoe UI","Malgun Gothic",system-ui,sans-serif}
  .wrap{max-width:1240px;margin:0 auto;padding:28px 20px 80px}
  h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
  h2{font-size:15px;margin:0 0 12px;letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
  .sub{color:var(--muted);font-size:13px;margin-bottom:24px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:18px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .kpi b{display:block;font-size:24px;font-weight:650;letter-spacing:-.02em}
  .kpi span{color:var(--muted);font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:600;font-size:12px;cursor:pointer;white-space:nowrap;position:sticky;top:0;background:var(--panel)}
  th.static{cursor:default}
  tbody tr:hover{background:var(--chip)}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  code,.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}
  .chip{display:inline-block;background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:11.5px;color:var(--muted);margin:0 4px 4px 0}
  .ok{color:var(--ok)} .warn{color:var(--warn)} .err{color:var(--err)} .muted{color:var(--muted)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  input[type=search],select{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:13px}
  input[type=search]{flex:1;min-width:220px}
  .tableWrap{overflow-x:auto;max-height:60vh;overflow-y:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
  .check{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line)}
  .check:last-child{border-bottom:0}
  .bar{height:7px;background:var(--chip);border-radius:4px;overflow:hidden;margin-top:3px}
  .bar i{display:block;height:100%;background:var(--accent)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .two>*{min-width:0}
  @media (max-width:860px){.two{grid-template-columns:1fr}}
  #pitches{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:2px 14px}
  details summary{cursor:pointer;color:var(--accent);font-size:13px}
  pre{background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto;font-size:12px;margin:10px 0 0;max-width:100%}
  a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
  .flag{border-left:3px solid var(--warn);padding-left:12px;margin:10px 0}
  .flag.block{border-color:var(--err)}
  ul{margin:6px 0 0;padding-left:18px} li{margin:3px 0}
  .pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;color:var(--muted);font-size:12px}
  button{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:inherit;font-size:12.5px;cursor:pointer}
  button:hover{border-color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <h1>연호전자 커넥터 카탈로그 — DB/ES 인제스트 분석결과</h1>
  <div class="sub" id="head"></div>

  <div class="kpis" id="kpis"></div>

  <div class="two">
    <div class="card">
      <h2>검증</h2>
      <div id="checks"></div>
    </div>
    <div class="card">
      <h2>카테고리 분포 (부품 820 기준)</h2>
      <div id="cats"></div>
      <h2 style="margin-top:16px">피치 분포 (mm)</h2>
      <div id="pitches"></div>
    </div>
  </div>

  <div class="card">
    <h2>판단이 필요한 항목</h2>
    <div id="flags"></div>
  </div>

  <div class="card">
    <h2>부품 820건</h2>
    <div class="row">
      <input type="search" id="q" placeholder="MPN·정규화키·패밀리·설명 검색 (예: 05002HR, YW396, FFC)">
      <select id="cat"></select>
      <select id="pitch"></select>
      <select id="img">

        <option value="ok">수집완료만</option>
        <option value="no">미수집만</option>
      </select>
      <span class="muted mono" id="count"></span>
    </div>
    <div class="tableWrap">
      <table>
        <thead><tr>
          <th data-k="mpn">MPN</th>
          <th data-k="norm">mpnNorm</th>
          <th data-k="cat">카테고리</th>
          <th data-k="pitch" class="num">피치</th>
          <th data-k="pins" class="num">핀</th>
          <th data-k="h">높이(mm)</th>
          <th data-k="fam">패밀리</th>
          <th class="static">링크</th>
        </tr></thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
    <div class="pager">
      <button id="prev">◀ 이전</button><span id="page"></span><button id="next">다음 ▶</button>
    </div>
    <div id="detail"></div>
  </div>

  <div class="two">
    <div class="card">
      <h2>DB 행 (sp_part) 샘플</h2>
      <pre id="db"></pre>
    </div>
    <div class="card">
      <h2>ES 문서 (sp-parts) 샘플</h2>
      <pre id="es"></pre>
    </div>
  </div>

  <div class="card">
    <h2>투입 절차</h2>
    <ol id="plan" class="mono" style="font-size:12.5px"></ol>
    <details style="margin-top:10px"><summary>리스크 노트 전체</summary><ul id="risks"></ul></details>
  </div>
</div>

const kpi = [
  ['부품(sp_part)', D.counts.parts],
  ['원본 행', D.counts.sourceRows],
  ['중복 병합', D.counts.collapsed],
  ['시리즈', D.counts.series],
  ['오퍼(sp_part_offer)', D.counts.offers],
  ['가격구간', D.counts.priceBreaks],

];

el('checks').innerHTML = D.checks.map((c) => {
  const cls = c.kind === 'err' ? (c.count === 0 ? 'ok' : 'err') : c.kind === 'warn' ? 'warn' : 'muted';
  const mark = c.kind === 'err' ? (c.count === 0 ? '통과' : '실패') : '확인';
  return `<div class="check"><span>${esc(c.name)}</span><span class="${cls} mono">${esc(c.count)}건 · ${mark}</span></div>`;
}).join('');

  el(target).innerHTML = Object.entries(obj).sort((a,b)=>b[1]-a[1]).map(([k,v]) =>
    `<div style="margin-bottom:7px"><div style="display:flex;justify-content:space-between"><span>${esc(k)}</span><span class="mono muted">${v}</span></div>
     <div class="bar"><i style="width:${(v/total*100).toFixed(1)}%"></i></div></div>`).join('');
}
dist('cats', D.categoryCounts, D.counts.parts);
dist('pitches', D.pitchCounts, D.counts.parts);

const sc = D.searchCoverage, ag = D.aliasGap;
el('flags').innerHTML = `
  <div class="flag"><b class="ok">해결 · 제조사 별칭 반영</b><div>${esc(ag.issue)}</div>
    <div class="muted">근거: ${esc(ag.sourceRequirement)}</div><div>조치: <code>${esc(ag.action)}</code></div></div>
  <div class="flag"><b class="warn">스펙 검색 2트랙 무효 (specsSi ${sc.specsSiPopulated}/${sc.specsSiTotal})</b>
    <div>${esc(sc.effect)}</div>
    <div class="muted">검색 불가 예: ${sc.notSearchableExamples.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>
    <ul>${sc.resolutionOptions.map(o=>`<li><b>${esc(o.option)}${o.recommended?' (권장)':''}</b> — ${esc(o.action)}<br><span class="muted">${esc(o.impact)}</span></li>`).join('')}</ul></div>
  <div class="flag"><b class="warn">관리자 화면 영향</b><ul>${D.adminUiEffects.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
  <div class="flag"><b>중복 병합 ${D.duplicates.length}건 · 피치 이상치 ${D.outliers.length}건(verified)</b>
    <ul>${D.duplicates.map(d=>`<li><code>${esc(d.mpn)}</code> 원본행 ${d.sourceRecordIds.join('·')} / 시리즈 ${d.seriesIds.join('·')} — ${esc(d.reason)}</li>`).join('')}
    ${D.officialChecks.map(c=>`<li><code>${esc(c.mpn)}</code> ${esc(c.field)}=${esc(c.value)} → <span class="ok">${esc(c.result)}</span> · ${esc(c.evidence)} <a href="${esc(c.sourceUrl)}" target="_blank">공식페이지</a></li>`).join('')}</ul></div>`;

el('plan').innerHTML = D.ingestPlan.map(x=>`<li>${esc(x.replace(/^[①②③④]\s*/,''))}</li>`).join('');
el('risks').innerHTML = D.riskNotes.map(x=>`<li>${esc(x)}</li>`).join('');
el('db').textContent = JSON.stringify(D.sampleDb.sp_part, null, 2);
el('es').textContent = JSON.stringify(D.sampleEs, null, 2);

// ── 표 ────────────────────────────────────────────────────────────────────────
const PAGE = 100;
let sortKey = 'mpn', sortDir = 1, page = 0, view = D.rows;

el('cat').innerHTML = '<option value="">카테고리 전체</option>' +
  Object.keys(D.categoryCounts).map(c=>`<option>${esc(c)}</option>`).join('');
el('pitch').innerHTML = '<option value="">피치 전체</option>' +
  Object.keys(D.pitchCounts).sort((a,b)=>a-b).map(p=>`<option value="${p}">${p} mm</option>`).join('');

function apply() {
  const q = el('q').value.trim().toLowerCase();
  const cat = el('cat').value, pitch = el('pitch').value, img = el('img').value;
  view = D.rows.filter(r =>
    (!cat || r.cat === cat) &&
    (!pitch || String(r.pitch) === pitch) &&
    (!img || (img === 'ok' ? r.img !== null : r.img === null)) &&
    (!q || r.mpn.toLowerCase().includes(q) || r.norm.toLowerCase().includes(q)
        || r.fam.toLowerCase().includes(q) || r.fkey.toLowerCase().includes(q)
        || r.desc.toLowerCase().includes(q))
  );
  view.sort((a,b)=>{
    const x = a[sortKey], y = b[sortKey];
    const c = typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y));
    return c * sortDir;
  });
  page = 0; render();
}
function render() {
  const start = page * PAGE, slice = view.slice(start, start + PAGE);
  el('count').textContent = `${view.length} / ${D.rows.length}건`;
  el('page').textContent = view.length === 0 ? '0' : `${start+1}–${Math.min(start+PAGE, view.length)}`;
  el('tb').innerHTML = slice.map((r,i)=>`<tr data-i="${start+i}">
    <td class="mono"><b>${esc(r.mpn)}</b></td>
    <td class="mono muted">${esc(r.norm)}</td>
    <td>${esc(r.cat)}</td>
    <td class="num">${esc(r.pitch)}</td>
    <td class="num">${esc(r.pins)}</td>
    <td class="num muted">${r.h ? r.h.join(' / ') : '<span class="warn">view drawing</span>'}</td>
    <td class="mono muted">${esc(r.fam)}</td>
    <td>${r.img ? `<a href="${esc(r.img)}" target="_blank">이미지</a>` : '<span class="warn">미수집</span>'}
        · <a href="${esc(r.pdf)}" target="_blank">PDF</a> · <a href="${esc(r.src)}" target="_blank">원본</a></td>
  </tr>`).join('');
}
el('tb').addEventListener('click', (e) => {
  const tr = e.target.closest('tr'); if (!tr || e.target.tagName === 'A') return;
  const r = view[Number(tr.dataset.i)];
  el('detail').innerHTML = `<pre>${esc(JSON.stringify({
    mpn:r.mpn, mpnNorm:r.norm, category:r.cat,
    normalized_specs:{part_type:'connector', connector_category:r.cat, pin_count:r.pins, pitch_mm:r.pitch,
      family_pattern:r.fam, family_match_key:r.fkey, series_available_pins:r.pinsAvail,
      ...(r.h ? {product_height_mm:r.h} : {})},
    image_url:r.img, imageStatus:r.imgSt, datasheet_url:r.pdf,
    catalog_metadata:{seriesIds:r.sid, sourceRecordIds:r.rid, sourceUrl:r.src},
    description:r.desc
  }, null, 2))}</pre>`;
  el('detail').scrollIntoView({behavior:'smooth', block:'nearest'});
});
document.querySelectorAll('th[data-k]').forEach(th => th.addEventListener('click', () => {
  const k = th.dataset.k;
  sortDir = sortKey === k ? -sortDir : 1; sortKey = k; apply();
}));
['q','cat','pitch','img'].forEach(id => el(id).addEventListener('input', apply));
el('prev').onclick = () => { if (page > 0) { page--; render(); } };
el('next').onclick = () => { if ((page+1)*PAGE < view.length) { page++; render(); } };
apply();
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAMPLEPCB</title>
    <!-- 스마트 BOM(Parts Eyes 시안) 타이포 — Pretendard + Noto Sans KR -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" />
    <!-- 테마를 첫 페인트 전에 심는다. 앱이 뜬 뒤 붙이면 라이트로 한 번 그려졌다가 다크로
         바뀌는 깜빡임이 보인다. style.css 는 data-theme 만 보므로 여기서 항상 명시한다. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('sp-theme');
          var dark = saved === 'dark'
            || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
